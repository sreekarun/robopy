[project]
name = "robo"
version = "0.1.0"
description = "Python robot for Raspberry Pi 5 — runs on Mac via fake/say backends"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Installed only on the Raspberry Pi 5
pi = [
    "gpiozero>=2.0",
    "lgpio>=0.2",
    "picamera2>=0.3",
]
# Mac (and any non-Pi machine): webcam capture
mac = [
    "opencv-python>=4.9",
]
# Voice commands (speech-to-text). Works on Mac and Pi.
#   faster-whisper: offline STT engine (both platforms)
#   sounddevice:    server-side mic capture (needs libportaudio2 on the Pi)
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
]
# Installed when you turn on the AI brain
ai = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
robo = "robo.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["robo*"]
